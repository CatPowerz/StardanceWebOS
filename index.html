<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatOS - Cute Cats on your Cat OS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <img src="bg.jpg" class="bg" alt="Background Image">
<div id="welcome" class="panel">
    <div class="paneltop" id="welcomeheader">
        <div class="window-controls">
            <span class="dot red btn-close"></span>
            <span class="dot yellow btn-min"></span>
            <span class="dot green btn-max"></span>
        </div>
        <span class="window-title">welcome</span>
    </div>
    <h2>Welcome to CatOS</h2>
    <p>Cute Cats on your cat-themed operating system</p>
    <button class="boot-btn">Get Started</button>
</div>


<div id="pixel" class="panel hidden">
    <div class="paneltop" id="pixelheader">
        <div class="window-controls">
            <span class="dot red btn-close"></span>
            <span class="dot yellow btn-min"></span>
            <span class="dot green btn-max"></span>
        </div>
        <span class="window-title">Pixel</span>
    </div>
    <h2>My cute cat Pixel</h2>
    <img src="pixel.jpeg" alt="Pixel" class="pixel">
</div>
<div id="notepad" class="panel hidden">
    <div class="paneltop" id="notepadheader">
        <div class="window-controls">
            <span class="dot red btn-close"></span>
            <span class="dot yellow btn-min"></span>
            <span class="dot green btn-max"></span>
        </div>
        <span class="window-title">Notepad</span>
    </div>
    <h2>Notepad</h2>
    <p>Does not save. That's something for WebOS 2 :)</p>
    <textarea class="notepad-input" placeholder="Type here..."></textarea>
    
</div>
    <div class="topbar">
        <p>CatOS</p>
        <p id="clock"></p>
    </div>
 
    <nav class="bottombar">
    <div id="dock-welcome" data-window="welcome" class="dock-icon" title="Welcome">👋</div>
    <div id="dock-facts" data-window="pixel" class="dock-icon" title="Pixel">🐱</div>
    <div id="dock-notepad" data-window="notepad" class="dock-icon" title="Notepad">📝</div>
    
</nav>
</body>
<script src="script.js"></script>
</html>
